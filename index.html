<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Icon Slots</title>
    <style>
        .icon-group {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            margin: 10px;
        }

        .label {
            font-size: 16px;
            margin-bottom: 5px;
        }

        .icon-slot {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            font-size: 50px;
            user-select: none;
        }
    </style>
</head>
<body>

    <div class="icon-group">
        <div class="label">text</div>
        <div class="icon-slot">⚪</div>
    </div>

    <div class="icon-group">
        <div class="label">text</div>
        <div class="icon-slot">⚪</div>
    </div>

</body>
</html>
